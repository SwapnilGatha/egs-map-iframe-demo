<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eurogas – Stations Map Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1a1a1a;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
      color: #1e3a8a;
    }

    .menu {
      font-size: 22px;
      cursor: pointer;
    }

    /* Main Section */
    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .underline {
      width: 300px;
      height: 3px;
      background: #1a1a1a;
      margin: 10px auto 20px;
    }

    .note {
      color: #1e40af;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid #1e3a8a;
      padding: 10px 18px;
      background: white;
      color: #1e3a8a;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn.active {
      background: #1e3a8a;
      color: white;
    }

    /* Card */
    .container {
      padding: 0 20px 40px;
    }

    .card {
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 8px;
    }

    /* Embed code */
    .code {
      margin-top: 16px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      overflow-x: auto;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">eurogas</div>
    <div class="menu">☰</div>
  </header>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Stations map – Get directions</h1>
    <div class="underline"></div>

    <div class="note">
      This map is only replicable with permission by Eurogas and gibgas, who owns and manages the data.
    </div>

    <div class="buttons">
      <button class="btn" data-url="http://localhost:5173/radius">Radius search</button>
      <button class="btn" data-url="http://localhost:5173/map">Stations map</button>
      <button class="btn active" data-url="http://localhost:5173/route">Get directions</button>
    </div>
  </div>

  <!-- Iframe Section -->
  <div class="container">
    <div class="card">
      <iframe 
        src="http://localhost:5173/route"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <footer>
    © 2026 Eurogas Demo • Iframe Integration Example
  </footer>

  <script>
    document.querySelectorAll('.btn').forEach(button => {
      button.addEventListener('click', function() {
        // Remove active class from all buttons
        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        
        // Add active class to clicked button
        this.classList.add('active');
        
        // Update iframe src
        const iframeUrl = this.getAttribute('data-url');
        document.querySelector('iframe').src = iframeUrl;
      });
    });
  </script>

</body>
</html>
